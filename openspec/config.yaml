schema: spec-driven

# Project facts (stack, structure, API contract, dependencies) live in AGENTS.md,
# which OpenCode loads in every session. This context only holds OpenSpec-specific guidance.
#
# PENDING (fill in when decided):
#   - Capability grouping criterion (user story mapping: one capability per user activity) -> add to context + rules.proposal
#   - API types location (e.g. src/shared/api) -> add to AGENTS.md + rules.design
#   - Test tool -> add to AGENTS.md

context: |
  All artifacts are written in English.
  The architect, after creating or editing any artifact, runs `openspec validate <change-name> --strict`
  and fixes format errors until it passes. If a fix would change the meaning of a
  requirement, scenario or decision, it does not apply it: it reports the error and asks.
  It reports the final validation result at handoff. Checking off tasks in tasks.md
  is not an artifact edit.

  Existing capabilities:
  - theming: color system (primitive and semantic tokens) and application themes
    (traditional default and dark), with WCAG AA text contrast and 3:1 for UI
    boundaries and focus indicators.
  - base-controls: action controls (button, link), radius tokens and icon entry point
  - form-fields: data-entry controls (field, input, select, textarea, checkbox, radio, bean scale, intensity slider)
  - filtering: facet controls and filtering behaviour (search, combobox, range, options, taxonomy cascade, applied-filter chips)
  - feedback: status and messaging components (badge, callout, toast, modal, empty state)
  - content-structure: content containers (card, collapsible, tabs, label/value row, pagination)
  - app-shell: app layout (header, sidebar, main area, mobile filter panel, registration layout, logo)

rules:
  proposal:
    - Reuse an existing capability before creating a new one.
    - Always include an explicit out-of-scope (non-goals) section.
    - A change is described by one verb and one object (e.g. "add login") and must fit in a single implementation session. If it needs "and", split it.
  specs:
    - Describe observable behavior only. Never name components, libraries or implementation details.
    - Every screen or interaction covers loading, empty, success and error states.
    - Include error scenarios, not only the happy path.
    - Every piece of data shown in the UI maps to a real field of the API (OpenAPI spec).
  design:
    - List every API endpoint consumed with method, path, auth, request, response and errors.
    - Use the generated API types from src/shared/api/schema.ts. Only define derived or UI-specific types, and define them before any component.
    - Explain how each API error is presented to the user.    
    - List the routes, components and files created or modified, each with its full path and its Feature-Sliced Design layer (app, pages, widgets, features, entities, shared). Next.js route files go in the root app/ folder and only import screens from src/pages/.
    - When a feature uses the shared card, map which API field fills each card section.
  tasks:
    - The first task group defines the derived types the change needs from the generated API types. It never edits or redefines generated types.
    - Write tests before the implementation they cover.
    - Organize tasks by complete vertical slices (data to screen), not by technical layer.
    - Mark a task complete only after verifying it.
    - Tasks only touch files outside openspec/ (except checking off tasks.md).
    - Tasks never wait on an implementation detail; settle it in design.md before handoff. A product decision (a mechanism shared by several components, or anything that changes a settled decision) is asked of Augusto before tasks are written.